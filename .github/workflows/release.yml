name: Release

on:
  push:
    tags:
      - "v*"

# Three jobs so that the permanent CRX signing key never shares a job with
# third-party code: build runs npm and esbuild without secrets, sign runs only
# Node built-ins with the key, release holds the write token.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: |
          set -e
          npm ci --ignore-scripts

      - name: Test
        run: |
          set -e
          npm test

      - name: Verify tag matches manifest version
        run: |
          set -e
          VERSION=$(node -p "require('./manifest.json').version")
          VERSION_NAME=$(node -p "require('./manifest.json').version_name || ''")
          TAG=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG#v}
          EXPECTED_VERSION=$TAG_VERSION
          case "$TAG_VERSION" in
            *-beta.*)
              if [ "$VERSION_NAME" != "$TAG_VERSION" ]; then
                echo "Manifest version_name does not match beta release tag." >&2
                exit 1
              fi
              # Betas use the previous stable version so Chrome will not treat
              # the same-base stable release as a downgrade.
              MANIFEST_MAJOR=${VERSION%%.*}
              MANIFEST_REMAINDER=${VERSION#*.}
              MANIFEST_MINOR=${MANIFEST_REMAINDER%%.*}
              MANIFEST_REMAINDER=${MANIFEST_REMAINDER#*.}
              MANIFEST_PATCH=${MANIFEST_REMAINDER%%.*}
              MANIFEST_BETA=${MANIFEST_REMAINDER#*.}
              if [ "$MANIFEST_REMAINDER" = "$MANIFEST_BETA" ] ||
                [ "${MANIFEST_BETA#*.}" != "$MANIFEST_BETA" ]; then
                echo "Beta manifest version must have four numeric components." >&2
                exit 1
              fi
              for COMPONENT in "$MANIFEST_MAJOR" "$MANIFEST_MINOR" \
                "$MANIFEST_PATCH" "$MANIFEST_BETA"; do
                case "$COMPONENT" in
                  ''|*[!0-9]*)
                    echo "Beta manifest version must have four numeric components." >&2
                    exit 1
                    ;;
                esac
              done

              TAG_BASE=${TAG_VERSION%-beta.*}
              TAG_BETA=${TAG_VERSION##*-beta.}
              TAG_MAJOR=${TAG_BASE%%.*}
              TAG_REMAINDER=${TAG_BASE#*.}
              TAG_MINOR=${TAG_REMAINDER%%.*}
              TAG_PATCH=${TAG_REMAINDER#*.}
              if [ "$TAG_REMAINDER" = "$TAG_PATCH" ] ||
                [ "${TAG_PATCH#*.}" != "$TAG_PATCH" ]; then
                echo "Beta release tag has an invalid version." >&2
                exit 1
              fi
              for COMPONENT in "$TAG_MAJOR" "$TAG_MINOR" "$TAG_PATCH" \
                "$TAG_BETA"; do
                case "$COMPONENT" in
                  ''|*[!0-9]*)
                    echo "Beta release tag has an invalid version." >&2
                    exit 1
                    ;;
                esac
              done

              if [ "$MANIFEST_BETA" -ne "$TAG_BETA" ]; then
                echo "Manifest beta component does not match release tag." >&2
                exit 1
              fi
              if [ "$MANIFEST_MAJOR" -lt "$TAG_MAJOR" ] ||
                { [ "$MANIFEST_MAJOR" -eq "$TAG_MAJOR" ] &&
                  [ "$MANIFEST_MINOR" -lt "$TAG_MINOR" ]; } ||
                { [ "$MANIFEST_MAJOR" -eq "$TAG_MAJOR" ] &&
                  [ "$MANIFEST_MINOR" -eq "$TAG_MINOR" ] &&
                  [ "$MANIFEST_PATCH" -lt "$TAG_PATCH" ]; }; then
                exit 0
              fi
              echo "Beta manifest base must be lower than release tag." >&2
              exit 1
              ;;
          esac
          if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Manifest version does not match release tag." >&2
            exit 1
          fi

      - name: Build package
        run: |
          set -e
          npm run package

      - name: Extract release notes
        run: |
          set -e
          TAG=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG#v}
          CHANGELOG_VERSION=$TAG_VERSION
          case "$TAG" in
            v*-beta.*)
              CHANGELOG_VERSION=$(printf '%s' "$TAG_VERSION" |
                sed 's/-beta\.[0-9][0-9]*$//')
              ;;
          esac
          NOTES_FILE="release-notes.md"
          if awk -v version="$CHANGELOG_VERSION" '
            BEGIN {
              heading = "## [" version "] - "
              date_pattern = "^[0-9][0-9][0-9][0-9]-"
              date_pattern = date_pattern "[0-9][0-9]-[0-9][0-9][[:space:]]*$"
            }
            index($0, "## [") == 1 {
              if (found) exit
              date = substr($0, length(heading) + 1)
              if (index($0, heading) == 1 && date ~ date_pattern) {
                found = 1
              }
              next
            }
            found {
              if ($0 ~ /^[[:space:]]*$/) {
                if (started) blank_lines++
                next
              }
              while (blank_lines > 0) {
                print ""
                blank_lines--
              }
              print
              started = 1
            }
            END {
              if (!found) exit 1
              if (!started) exit 2
            }
          ' CHANGELOG.md > "$NOTES_FILE"; then
            echo "Release notes taken from CHANGELOG.md."
          else
            EXTRACTION_STATUS=$?
            case "$TAG" in
              v*-beta.*)
                if [ "$EXTRACTION_STATUS" -eq 2 ]; then
                  printf 'Warning: CHANGELOG section for %s is empty; ' \
                    "$TAG" >&2
                else
                  printf 'Warning: no CHANGELOG section found for %s; ' \
                    "$TAG" >&2
                fi
                printf 'falling back to generated notes.\n' >&2
                rm -f "$NOTES_FILE"
                ;;
              *)
                if [ "$EXTRACTION_STATUS" -eq 2 ]; then
                  printf 'CHANGELOG section for %s is empty; ' "$TAG" >&2
                  printf 'add release notes below ## [%s] - YYYY-MM-DD.\n' \
                    "$CHANGELOG_VERSION" >&2
                else
                  printf 'No CHANGELOG section found for %s; ' "$TAG" >&2
                  printf 'add a ## [%s] - YYYY-MM-DD section.\n' \
                    "$CHANGELOG_VERSION" >&2
                fi
                exit 1
                ;;
            esac
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          if-no-files-found: error
          path: |
            youtube-tuner-*.zip
            release-notes.md

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package

      # No npm install in this job: tools/crx.mjs needs only Node built-ins,
      # so nothing from node_modules ever runs next to the key.
      - name: Sign CRX
        env:
          YTT_CRX_KEY_PEM: ${{ secrets.YTT_CRX_KEY_PEM }}
        run: |
          set -e
          umask 077
          KEY_FILE="$RUNNER_TEMP/key.pem"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$YTT_CRX_KEY_PEM" > "$KEY_FILE"
          YTT_CRX_KEY="$KEY_FILE" node tools/crx.mjs

      - name: Write checksums
        run: |
          set -e
          sha256sum youtube-tuner-*.zip youtube-tuner-*.crx > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          if-no-files-found: error
          path: |
            youtube-tuner-*.crx
            SHA256SUMS

  release:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release/youtube-tuner-*.zip
            release/youtube-tuner-*.crx

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG=${GITHUB_REF#refs/tags/}
          PRERELEASE=()
          case "$TAG" in
            v*-beta.*)
              PRERELEASE=(--prerelease)
              ;;
          esac
          if [ -f release/release-notes.md ]; then
            NOTES=(--notes-file release/release-notes.md)
          else
            NOTES=(--generate-notes)
          fi
          gh release create "$TAG" \
            release/youtube-tuner-*.zip release/youtube-tuner-*.crx \
            release/SHA256SUMS \
            --title "Release $TAG" "${NOTES[@]}" "${PRERELEASE[@]}"
