<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>youtube-tuner</title>
    <style>
      :root {
        --color-scheme: light;
        --bg-color: #fff;
        --text-color: #000;
        --muted-text-color: #555;
        --button-bg: #f1f3f4;
        --button-hover-bg: #e8eaed;
        --button-active-bg: #dadce0;
        --button-text: #000;
        --control-border: #767676;
        --separator-color: #ddd;
        --link-color: #0000ee;
        --focus-color: #06c;
        --toggle-bg: #767676;
        --toggle-checked-bg: #1670d2;
        --toggle-thumb: #fff;
        color-scheme: var(--color-scheme);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-scheme: dark;
          --bg-color: #202124;
          --text-color: #f1f3f4;
          --muted-text-color: #bdc1c6;
          --button-bg: #303134;
          --button-hover-bg: #3c4043;
          --button-active-bg: #292a2d;
          --button-text: #f1f3f4;
          --control-border: #777b80;
          --separator-color: #5f6368;
          --link-color: #8ab4f8;
          --focus-color: #8ab4f8;
          --toggle-bg: #5f6368;
          --toggle-checked-bg: #8ab4f8;
          --toggle-thumb: #fff;
        }
      }
      body {
        background: var(--bg-color);
        color: var(--text-color);
        font: 14px/1.5 system-ui, sans-serif;
        margin: 0;
        padding: 1em;
        width: 19em;
      }
      p { margin: 0 0 .8em; }
      button {
        background: var(--button-bg);
        border: 1px solid var(--control-border);
        border-radius: 6px;
        color: var(--button-text);
        cursor: pointer;
        font: inherit;
        margin-bottom: .8em;
        padding: .45em .85em;
        transition: background-color 120ms ease;
      }
      button:not(:disabled):hover { background: var(--button-hover-bg); }
      button:not(:disabled):active {
        background: var(--button-active-bg);
        box-shadow: inset 0 1px 2px rgb(0 0 0 / .12);
      }
      button:disabled {
        cursor: default;
        opacity: .55;
      }
      label { display: block; margin-bottom: .8em; }
      hr {
        border: 0;
        border-top: 1px solid var(--separator-color);
        margin: 1em 0;
      }
      a { color: var(--link-color); }
      small, .explanation { color: var(--muted-text-color); }
      input[type="checkbox"] {
        appearance: none;
        background: var(--toggle-bg);
        border: 1px solid var(--control-border);
        border-radius: 999px;
        box-sizing: border-box;
        cursor: pointer;
        display: inline-flex;
        height: 1.5em;
        margin: 0 .4em 0 0;
        padding: .15em;
        transition: background-color .15s ease;
        vertical-align: middle;
        width: 2.5em;
      }
      input[type="checkbox"]::before {
        background: var(--toggle-thumb);
        border-radius: 50%;
        content: "";
        height: 1em;
        transform: translateX(0);
        transition: transform .15s ease;
        width: 1em;
      }
      input[type="checkbox"]:checked {
        background: var(--toggle-checked-bg);
      }
      input[type="checkbox"]:checked::before {
        transform: translateX(1em);
      }
      input[type="checkbox"]:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--focus-color);
        outline-offset: 2px;
      }
      input[type="checkbox"]:disabled {
        cursor: not-allowed;
        opacity: .55;
      }
    </style>
  </head>
  <body>
    <label><input type="checkbox" id="enabled"> Filtering enabled</label>

    <hr>

    <p id="subs-age"></p>
    <button id="refresh-subs" type="button">Refresh now</button>
    <p class="explanation">A YouTube channels tab will open, scroll to the end
      (about 20 seconds), and close by itself.</p>

    <div id="sync-row" hidden>
      <button id="sync-now" type="button">Sync now</button>
      <small id="sync-status"></small>
      <small id="sync-last-sync"></small>
    </div>

    <hr>

    <button id="check-update" type="button">Check for updates</button>
    <p id="update-status" hidden></p>
    <label><input type="checkbox" id="update-check-enabled">
      Check for updates once per day (asks api.github.com)</label>

    <hr>

    <button id="open-options" type="button">Options</button>

    <script src="dist/popup.js"></script>
  </body>
</html>
